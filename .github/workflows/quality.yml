name: TankApp quality gates

# D4: Qualitäts-Gates, die man nicht im Unit-Test sieht — Lighthouse gegen das
# gefüllte GUI und ein Lastpfad gegen /api/v1/overview (B7-Alltagsaggregat).
# Bewusst ein eigener Workflow und nicht Teil von tests.yml: Der CI-Spiegel
# aus AGENTS.md bleibt damit lokal lauffähig (kein Chrome-Download nötig).
#
# Die Gates laufen gegen den Demo-Stack (ops/quality/): dieselbe App, nur mit
# injizierter Preisabfrage statt InfluxDB und einer vorab gerechneten
# Engine-Publikation. Details, Budgets und letzte Messwerte: docs/QUALITAET.md
on:
  workflow_dispatch:
  schedule:
    # Sonntags 04:17 UTC — vor dem Wochen-Kommentar der Modell-Läufe.
    - cron: "17 4 * * 0"
  pull_request:
    paths:
      - "web/**"
      - "app/**"
      - "engine/**"
      - "ops/quality/**"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt
            engine/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Chromium installieren und Pfad merken
        working-directory: web
        id: chrome
        run: |
          npx playwright install --with-deps chromium
          echo "path=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_OUTPUT"
      - name: Lighthouse CI mit Budget
        run: npx --yes @lhci/cli@0.15.x autorun --config=web/lighthouserc.json
        env:
          # Chrome aus dem Playwright-Cache; LHCI findet ihn über CHROME_PATH.
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt
            engine/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Demo-Stack starten
        run: |
          python ops/quality/demo_server.py \
            --data-dir /tmp/tankapp-demo --static web/dist \
            --port 1355 --host 127.0.0.1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:1355/api/v1/health > /dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:1355/api/v1/health | head -c 400
      - name: Lastpfad /api/v1/overview
        run: node web/load/overview.mjs http://127.0.0.1:1355 30 8 | tee load-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-report
          path: load-report.json
          retention-days: 14
