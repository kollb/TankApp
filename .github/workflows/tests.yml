name: TankApp checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # O27: 3.12 ist die Linie des NAS-Bildes
        # (ops/nas/app/Dockerfile, PYTHON_VERSION) und muss hier stehen —
        # sonst ist „grün getestet“ ein anderer Interpreter als
        # „ausgeliefert“. 3.11 bleibt dabei, weil der Pi-Collector darauf
        # läuft (engine/requirements.txt zieht je Interpreter ein anderes
        # numpy). tests/test_o27_build_parity.py hält Bild und Matrix
        # zusammen.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            engine/requirements.txt
            app/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tankapp.py data-tools/polling_plan.py data-tools/collect_prices.py engine data-tools/export_influx.py data-tools/upload_influx.py tests
      - run: python -m ruff format --check app tankapp.py data-tools/polling_plan.py engine data-tools/export_influx.py tests
      - run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt
            engine/requirements.txt
      # O27: Dieselbe Node-Linie wie das Bild (NODE_VERSION im Dockerfile).
      # Ohne diese Zeile baute der Job mit der Node-Version des Runners —
      # eine dritte Linie neben Bild und quality.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      # Der Demo-Stack der unmocked Suite startet die echte App (numpy/pandas
      # für den Engine-Lauf) — deshalb die Python-Abhängigkeiten auch hier.
      - run: python -m pip install -r requirements-dev.txt
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - name: E2E ohne Mocks gegen den Demo-Stack
        # Eigene Suite (web/e2e/demo.spec.ts): startet den Demo-Stack selbst,
        # kein page.route — der Beleg, dass Server und GUI zusammenspielen.
        run: npm --prefix web run test:e2e:demo
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
          retention-days: 7

  nas-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f ops/nas/app/Dockerfile -t tankapp-web:check .
      - name: Check image runtime and built GUI
        run: >-
          docker run --rm tankapp-web:check python -c
          "from app.config import Settings; from app.data import LiveData; import pandas;
          s = Settings.from_env(); assert (s.static / 'index.html').is_file();
          assert LiveData(s).health()['polling_error'] == 'polling_missing';
          s.runtime.mkdir(parents=True, exist_ok=True);
          assert __import__('os').getuid() != 0"
      - name: Interpreter und tzdata-Stand des Bildes nennen (O27)
        # Sichtbar im Protokoll statt nur im Dockerfile: Dieselbe Python-Linie
        # wie die Matrix oben, und ein tzdata-Datenstand, der nicht von dem
        # des CI-Runners abweicht (Europe/Berlin kommt aus dem pip-Paket).
        run: >-
          docker run --rm tankapp-web:check python -c
          "import sys, tzdata, zoneinfo, datetime;
          print('python', sys.version.split()[0]);
          print('tzdata', tzdata.__version__);
          print('berlin', zoneinfo.ZoneInfo('Europe/Berlin'),
          datetime.datetime(2026, 7, 1, tzinfo=zoneinfo.ZoneInfo('Europe/Berlin')).utcoffset())"
      - name: Suite im Bild (O27)
        # Der eigentliche Nachweis, dass getestet wird, was läuft: derselbe
        # Interpreter, dieselben installierten Paket-Versionen wie im Betrieb,
        # nur pytest/ruff kommen dazu. Der Quellbaum wird gemountet statt ins
        # Bild kopiert, weil .dockerignore tests/ und docs/ ausschließt — beide
        # liest die Suite (Doku-Link-Test). --user 0, weil pip ins Site-Packages
        # des Bildes schreibt; PYTHONDONTWRITEBYTECODE=1 kommt aus dem Bild,
        # -p no:cacheprovider hält das gemountete Verzeichnis sauber.
        #
        # Bei Rot geht die Kurzfassung als **Annotation** raus, nicht nur ins
        # Log-Blob: Das Blob ist nicht aus jeder Umgebung erreichbar, und ein
        # roter Job ohne lesbare Ursache kostet einen Blindflug.
        run: |
          set -o pipefail
          # Actions führt run:-Blöcke mit `bash -e` aus: Ohne `set +e` bricht
          # die rote Pipeline das Skript, bevor die Annotation unten steht —
          # dann ist der Job rot **und** stumm (genau der erste Anlauf).
          set +e
          docker run --rm --user 0 -v "$PWD:/src" -w /src \
            -e TANKAPP_DATA_DIR=/tmp/tankapp-image \
            tankapp-web:check sh -c \
            "python -VV && python -c 'import numpy, pandas; print(\"numpy\", numpy.__version__, \"pandas\", pandas.__version__)' && python -m pip install --no-cache-dir -q -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider" \
            2>&1 | tee /tmp/suite-im-bild.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            msg=$(sed -n '/short test summary info/,$p' /tmp/suite-im-bild.log | head -60)
            [ -n "$msg" ] || msg=$(tail -n 60 /tmp/suite-im-bild.log)
            msg=$(printf '%s' "$msg" | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n')
            echo "::error title=Suite im Bild (O27)::${msg}"
          fi
          exit "$status"
