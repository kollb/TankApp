name: TankApp checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            engine/requirements.txt
            app/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tankapp.py data-tools/polling_plan.py data-tools/collect_prices.py engine data-tools/export_influx.py data-tools/upload_influx.py tests
      - run: python -m ruff format --check app tankapp.py data-tools/polling_plan.py engine data-tools/export_influx.py tests
      - run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
          retention-days: 7

  nas-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f ops/nas/app/Dockerfile -t tankapp-web:check .
      - name: Check image runtime and built GUI
        run: >-
          docker run --rm tankapp-web:check python -c
          "from app.config import Settings; from app.data import LiveData; import pandas;
          s = Settings.from_env(); assert (s.static / 'index.html').is_file();
          assert LiveData(s).health()['polling_error'] == 'polling_missing';
          s.runtime.mkdir(parents=True, exist_ok=True);
          assert __import__('os').getuid() != 0"
