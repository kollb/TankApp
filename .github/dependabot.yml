# Wöchentliche Update-PRs (montags) für alle Abhängigkeiten im Repo.
# Ablauf: PR prüfen → CI-Ampel abwarten → mergen → ausrollen,
# siehe docs/RP2.md, Abschnitt „Updates & Changelog“.
version: 2
updates:
  # Python (NAS-Image + CI): requirements-dev.txt bindet per -r
  # app/requirements.txt ein, diese wiederum engine/requirements.txt —
  # ein Eintrag am Root deckt daher die ganze Kette ab.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "[deps]"
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # React-GUI (wird ins NAS-Image gebaut).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "[deps]"
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # CI-Actions in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "[deps]"
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Basis-Images des NAS-Containers (node/python in ops/nas/app/Dockerfile).
  - package-ecosystem: "docker"
    directory: "/ops/nas/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "[deps]"
