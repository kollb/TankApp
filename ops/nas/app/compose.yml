# One application service. Reuses the existing InfluxDB; never creates/replaces it.
# Paths and user IDs are set by tankapp.py nas-up, not maintained by hand.
services:
  app:
    build:
      context: ../../..
      dockerfile: ops/nas/app/Dockerfile
      args:
        TANKAPP_BUILD_COMMIT: "${TANKAPP_BUILD_COMMIT:-}"
    restart: unless-stopped
    init: true
    # Prozess-Pool des Modell-Laufs braucht ein wenig /dev/shm.
    shm_size: 256m
    user: "${TANKAPP_UID:-1000}:${TANKAPP_GID:-1000}"
    ports:
      - "${TANKAPP_WEB_PORT:-1355}:1355"
    environment:
      TANKAPP_DATA_DIR: /data
      TANKAPP_ARCHIVE_DIR: /archive
      TANKAPP_POLLING_FILE: /config/polling.json
      TANKAPP_INFLUX_ENV: /config/influx.env
      TANKAPP_NETRC: /config/netrc
      TANKAPP_HISTORY_DAYS: "${TANKAPP_HISTORY_DAYS:-365}"
      TANKAPP_MODEL_FUELS: "${TANKAPP_MODEL_FUELS:-e10}"
      # Konzept §3.2: Stadt:Bundesland-Paare für den Feiertags-Dummy.
      TANKAPP_CITY_SUBDIVS: "${TANKAPP_CITY_SUBDIVS:-}"
      TANKAPP_WEBHOOK_TOKEN: "${TANKAPP_WEBHOOK_TOKEN:-}"
      # B5: 0 = automatisch (CPU-Kerne, max. 8), 1 = seriell.
      TANKAPP_MODEL_WORKERS: "${TANKAPP_MODEL_WORKERS:-0}"
      # B5: 1 = vorgeschlagene Schwellen aus dem Advice-Ledger anwenden (M7).
      TANKAPP_M7_AUTO_APPLY: "${TANKAPP_M7_AUTO_APPLY:-0}"
      # B5: kommagetrennte API-Schlüssel für 300/min (Konzept §11); leer = nur anonym.
      TANKAPP_API_KEYS: "${TANKAPP_API_KEYS:-}"
      TANKAPP_BUILD_COMMIT: "${TANKAPP_BUILD_COMMIT:-}"
      TZ: Europe/Berlin
    volumes:
      - type: bind
        source: ${TANKAPP_RUNTIME_DIR:?Run tankapp.py nas-up}
        target: /data/runtime
      - type: bind
        source: ${TANKAPP_ARCHIVE_DIR:?Run tankapp.py nas-up}
        target: /archive
      - type: bind
        source: ${TANKAPP_POLLING_FILE:?Run tankapp.py nas-up}
        target: /config/polling.json
        read_only: true
      - type: bind
        source: ${TANKAPP_INFLUX_ENV:?Run tankapp.py nas-up}
        target: /config/influx.env
        read_only: true
      - type: bind
        source: ${TANKAPP_NETRC:?Run tankapp.py nas-up}
        target: /config/netrc
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    stop_grace_period: 20s
