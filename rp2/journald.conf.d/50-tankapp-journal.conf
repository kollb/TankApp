# TankApp RP2: Journal-Größe begrenzen (TODO G2)
#
# journald kennt **keinen** Cap je Unit — `SystemMaxUse` gilt für das Journal
# des ganzen Systems. Auf einem RP2, der nur TankApp sammelt und an einer
# SD-Karte hängt, ist das der richtige Ort: ohne Begrenzung wächst das Journal
# monatelang und schreibt die Karte voll.
#
# Installation (liegt außerhalb des Repos und überlebt `git pull`):
#
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp ~/TankApp/rp2/journald.conf.d/50-tankapp-journal.conf \
#     /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
#
# Kontrolle und einmaliges Aufräumen statt Warten:
#
#   journalctl --disk-usage          # sollte dauerhaft ≤ 50M bleiben
#   sudo journalctl --vacuum-size=50M
#
# Werte ohne Leerzeichen schreiben (`50M`, nicht `50 M`).

[Journal]
# Harte Obergrenze für das gesamte Journal auf der Karte.
SystemMaxUse=50M
# Einzelne Datei kleiner halten: rotiert früher, weniger Schreibschock beim
# Umschalten, und ein Backup der Karte bleibt klein.
SystemMaxFileSize=10M
